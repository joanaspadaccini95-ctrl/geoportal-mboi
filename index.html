<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizações Parceiras - M'Boi Mirim</title>
    <meta name="description" content="Mapa colaborativo das organizações parceiras da região do M'Boi Mirim, Zona Sul de São Paulo.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="app-container">

    <!-- ============================ NAVBAR ============================ -->
    <nav class="navbar">
        <div class="brand-container">
            <div class="brand-logo"><i class="fa-solid fa-handshake-angle"></i></div>
            <div class="brand-title">
                <h1 id="appTitle">Organizações Parceiras - M'Boi Mirim</h1>
                <span id="appSubtitle">Carregando…</span>
            </div>
        </div>

        <div class="nav-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar organização…" autocomplete="off">
                <button class="search-clear" id="searchClear" title="Limpar busca" hidden>
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <a class="btn-header btn-incluir" id="btnIncluir" href="#" title="Cadastrar uma organização" hidden>
                <i class="fa-solid fa-circle-plus"></i> <span class="btn-label">Incluir</span>
            </a>

            <a class="btn-header btn-ajuda" id="btnInstrucoes" href="#" title="Como incluir uma organização" hidden>
                <i class="fa-solid fa-circle-question"></i> <span class="btn-label">Como incluir</span>
            </a>

            <button class="btn-header" id="btnRefresh" title="Recarregar dados da planilha">
                <i class="fa-solid fa-rotate"></i> <span class="btn-label">Atualizar</span>
            </button>

            <button class="btn-header btn-primary" id="btnExport" title="Exportar em .xlsx">
                <i class="fa-solid fa-file-excel"></i> <span class="btn-label">Exportar</span>
            </button>
        </div>
    </nav>

    <!-- ========================== CONTEÚDO ============================ -->
    <div class="main-content">

        <div id="map"></div>

        <!-- ---------------------- PAINEL LATERAL ---------------------- -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle-btn" id="btnToggleSidebar" title="Recolher/expandir painel">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

            <div class="sidebar-header">
                <h2><i class="fa-solid fa-sliders"></i> Camadas e Filtros</h2>
                <span class="count-pill" id="countPill">0</span>
            </div>

            <div class="sidebar-body">

                <!-- 1. Mapa base (compacto) -->
                <div class="filter-group compacto">
                    <div class="basemap-strip" id="basemapContainer"></div>
                </div>

                <!-- 2. Organizações -->
                <div class="filter-group group-flex" data-recolhivel>
                    <div class="group-title">
                        <button class="group-toggle" type="button" data-alvo="paineisOrgs">
                            <i class="fa-solid fa-chevron-down seta"></i>
                            <span>Organizações</span>
                        </button>
                        <span class="status-count" id="listCount">0</span>
                    </div>
                    <div class="group-corpo" id="paineisOrgs">
                        <div class="org-list" id="orgList"></div>
                    </div>
                </div>

                <!-- 3. Situação -->
                <div class="filter-group" id="grupoSituacao" data-recolhivel hidden>
                    <div class="group-title">
                        <button class="group-toggle" type="button" data-alvo="paineisSituacao">
                            <i class="fa-solid fa-chevron-down seta"></i>
                            <span>Situação</span>
                        </button>
                        <span class="group-actions">
                            <button data-todos="marcar" data-grupo="situacao">Todas</button>
                            <button data-todos="desmarcar" data-grupo="situacao">Nenhuma</button>
                        </span>
                    </div>
                    <div class="group-corpo" id="paineisSituacao">
                        <div class="filtro-lista" id="filtroSituacaoLista"></div>
                    </div>
                </div>

                <!-- 4. Categoria -->
                <div class="filter-group" id="grupoCategoria" data-recolhivel hidden>
                    <div class="group-title">
                        <button class="group-toggle" type="button" data-alvo="paineisCategoria">
                            <i class="fa-solid fa-chevron-down seta"></i>
                            <span>Categoria</span>
                        </button>
                        <span class="group-actions">
                            <button data-todos="marcar" data-grupo="categoria">Todas</button>
                            <button data-todos="desmarcar" data-grupo="categoria">Nenhuma</button>
                        </span>
                    </div>
                    <div class="group-corpo" id="paineisCategoria">
                        <div class="filtro-lista" id="filtroCategoriaLista"></div>
                    </div>
                </div>

                <!-- 5. Subprefeitura -->
                <div class="filter-group" id="grupoSubpref" data-recolhivel hidden>
                    <div class="group-title">
                        <button class="group-toggle" type="button" data-alvo="paineisSubpref">
                            <i class="fa-solid fa-chevron-down seta"></i>
                            <span>Subprefeitura</span>
                        </button>
                        <span class="group-actions">
                            <button data-todos="marcar" data-grupo="subpref">Todas</button>
                            <button data-todos="desmarcar" data-grupo="subpref">Nenhuma</button>
                        </span>
                    </div>
                    <div class="group-corpo" id="paineisSubpref">
                        <div class="filtro-lista" id="filtroSubprefLista"></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Confirmação após cadastrar/editar -->
        <div class="confirma-box" id="confirmaBox" hidden>
            <div class="confirma-icone"><i class="fa-solid fa-circle-check"></i></div>
            <div class="confirma-texto">
                <strong id="confirmaTitulo">Organização cadastrada</strong>
                <span id="confirmaSub">Confira se o ponto está no lugar certo.</span>
            </div>
            <div class="confirma-acoes">
                <button class="confirma-btn ok" id="confirmaOk">Está correto</button>
                <a class="confirma-btn corrigir" id="confirmaCorrigir" href="#">Corrigir</a>
            </div>
        </div>

        <!-- Aviso de geocodificação pendente -->
        <div class="update-info-badge" id="pendingBadge" hidden>
            <i class="fa-solid fa-location-crosshairs"></i>
            <div class="update-content">
                <div class="update-date">Geocodificação</div>
                <div class="update-desc" id="pendingText"></div>
            </div>
        </div>

        <!-- Overlay de carregamento -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-box">
                <div class="spinner"></div>
                <p id="loadingText">Lendo a planilha e georreferenciando endereços…</p>
            </div>
        </div>

    </div>
</div>

<!-- Modal: confirmar funcionamento / informar fechamento -->
<div class="modal-fundo" id="modalSituacao">
    <div class="modal-caixa">
        <h3 id="modalTitulo">Confirmar</h3>
        <p id="modalTexto"></p>

        <label class="modal-campo">
            <span>Seu nome <em style="color:#94a3b8">(opcional)</em></span>
            <input type="text" id="modalQuem" maxlength="120" autocomplete="off"
                   placeholder="Fica registrado quem informou">
        </label>

        <label class="modal-campo" id="modalGrupoMotivo" hidden>
            <span>Qual é o caso?</span>
            <select id="modalMotivo">
                <option value="Encerrada">A organização encerrou as atividades</option>
                <option value="Duplicada">É repetida — já existe outra igual no mapa</option>
            </select>
        </label>

        <label class="modal-campo" id="modalGrupoObs" hidden>
            <span>O que aconteceu? <em style="color:#94a3b8">(opcional)</em></span>
            <input type="text" id="modalObs" maxlength="300" autocomplete="off"
                   placeholder="Ex.: imóvel vazio desde janeiro">
        </label>

        <div class="modal-erro" id="modalErro"></div>

        <div class="modal-acoes">
            <button class="modal-btn neutro" id="modalCancelar">Cancelar</button>
            <button class="modal-btn ok" id="modalConfirmar">Confirmar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toastMsg"></span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="./config.js"></script>
<script src="./app.js"></script>

</body>
</html>
